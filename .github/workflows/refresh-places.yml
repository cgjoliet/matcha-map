name: Refresh Places Cache

on:
  schedule:
    # 6:00 AM UTC = 1:00 AM EST / midnight CST — runs once daily
    - cron: '0 6 * * *'
  workflow_dispatch:   # allows manual trigger from GitHub Actions UI

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit places-cache.json back to the repo
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # use Node 24 before it becomes mandatory

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh places cache
        env:
          AIRTABLE_TOKEN:        ${{ secrets.AIRTABLE_TOKEN }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: node scripts/refresh-places.js

      - name: Commit updated cache
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add places-cache.json
          git diff --staged --quiet || git commit -m "chore: refresh places cache [skip vercel]"
          git push
