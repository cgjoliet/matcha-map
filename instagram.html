            "tertiary-container": "#273b2e", "tertiary-fixed": "#d1e8d6",
            "outline": "#717976", "surface-container": "#e3f1e7",
            "on-surface": "#121e18", "on-secondary-fixed-variant": "#0e5138",

            "label-bold": ["14px", {"lineHeight":"1.2","letterSpacing":"0.05em","fontWeight":"700"}],
            "headline-md": ["32px", {"lineHeight":"1.2","fontWeight":"700"}],
            "body-md": ["16px", {"lineHeight":"1.6","fontWeight":"400"}]
          }
        }
      }
    }
  </script>

  <style>
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #b1f0ce; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #95d4b3; }

    .ig-gradient {
      background: linear-gradient(135deg, #405de6 0%, #833ab4 30%, #c13584 55%, #e1306c 75%, #fd1d1d 90%, #fcaf45 100%);
    }

    .ig-card {
      background: white;
      border: 2px solid #d8e6dc;
      border-radius: 1.25rem;
      overflow: hidden;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 3px 3px 0 rgba(1,38,31,0.07);
    }
    .ig-card:hover {
      transform: translateY(-3px);
      box-shadow: 5px 8px 0 rgba(1,38,31,0.10);
      border-color: #aacec3;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { animation: spin 0.9s linear infinite; }
  </style>
</head>

<body class="bg-background text-on-surface font-body-md min-h-screen">

<!-- ── Navigation ──────────────────────────────────────────────────────────── -->
<nav class="flex justify-between items-center w-full px-6 md:px-14 h-16 bg-primary sticky top-0 z-[500]">
  <a href="index.html" class="font-headline-md text-[22px] font-extrabold text-on-primary hover:opacity-90 transition-opacity">
    Indy Matcha
  </a>
  <div class="hidden md:flex items-center gap-8">
    <a href="index.html"     class="font-label-bold text-label-bold text-on-primary/70 hover:text-on-primary transition-colors">Find Matcha</a>
    <a href="instagram.html" class="font-label-bold text-label-bold text-on-primary border-b-2 border-on-primary pb-0.5">Instagram Spots</a>
    <a href="submit.html"    class="font-label-bold text-label-bold text-on-primary/70 hover:text-on-primary transition-colors">Submit a Spot</a>
    <a href="events.html"    class="font-label-bold text-label-bold text-on-primary/70 hover:text-on-primary transition-colors">Events</a>
  </div>
  <a href="submit.html" class="hidden md:inline-flex bg-secondary text-on-secondary px-5 py-2 rounded-full font-label-bold text-sm shadow-[3px_3px_0px_rgba(255,255,255,0.15)] hover:scale-105 active:scale-95 transition-all">
    + Add Spot
  </a>
  <button id="hamburger-btn" class="md:hidden flex flex-col justify-center items-center gap-1.5 w-10 h-10 rounded-lg hover:bg-white/10 transition-colors" aria-label="Menu">
    <span class="hamburger-bar block w-5 h-0.5 bg-on-primary transition-all duration-200"></span>
    <span class="hamburger-bar block w-5 h-0.5 bg-on-primary transition-all duration-200"></span>
    <span class="hamburger-bar block w-5 h-0.5 bg-on-primary transition-all duration-200"></span>
  </button>
</nav>

<!-- Mobile nav dropdown -->
<div id="mobile-menu" class="md:hidden" style="position:absolute;top:64px;left:0;right:0;background:#01261f;z-index:600;border-bottom:2px solid rgba(255,255,255,0.1);transform:translateY(-8px);opacity:0;pointer-events:none;transition:transform 0.18s ease,opacity 0.18s ease;">
  <div class="flex flex-col px-6 py-4 gap-1">
    <a href="index.html"     class="font-label-bold text-sm text-on-primary/70 py-3 border-b border-white/10">Find Matcha</a>
    <a href="instagram.html" class="font-label-bold text-sm text-on-primary    py-3 border-b border-white/10">Instagram Spots</a>
    <a href="submit.html"    class="font-label-bold text-sm text-on-primary/70 py-3 border-b border-white/10">Submit a Spot</a>
    <a href="events.html"    class="font-label-bold text-sm text-on-primary/70 py-3 border-b border-white/10">Events</a>
    <a href="submit.html"    class="mt-3 bg-secondary text-on-secondary px-5 py-3 rounded-full font-label-bold text-sm text-center">+ Add Spot</a>
  </div>
</div>

<!-- ── Page header ─────────────────────────────────────────────────────────── -->
<div class="text-center pt-12 pb-8 px-6">
  <h1 class="font-headline-xl text-[40px] md:text-[52px] text-primary leading-tight">Instagram Spots</h1>
</div>

<!-- ── Grid ────────────────────────────────────────────────────────────────── -->
<div class="px-6 md:px-12 lg:px-20 pb-16">

  <!-- Loading state -->
  <div id="loading" class="flex justify-center py-20">
    <svg class="spinner w-7 h-7 text-secondary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
    </svg>
  </div>

  <!-- Cards grid -->
  <div id="ig-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 hidden"></div>

  <!-- Error state -->
  <div id="error-state" class="hidden text-center py-20 text-on-surface-variant text-sm">
    Couldn't load Instagram accounts. Check back soon.
  </div>

</div>

<script>
  const AIRTABLE_TOKEN = 'patoO4IGP4ESJoWnD.a05da83d9b8e7a4f9808aa5cf85cf4e26b6971aa287b0bdaf76ffab3c76ec21e';
  const BASE_ID        = 'apph243NPR5JjRPav';
  const IG_TABLE       = 'Instagram';

  function handleFromUrl(url) {
    try {
      const path = new URL(url).pathname.replace(/\//g, '');
      return path ? '@' + path : '';
    } catch { return ''; }
  }

  const TAG_CONFIG = {
    'pop-ups': {
      icon: 'storefront',
      label: 'pop up',
      classes: 'bg-secondary-container text-on-secondary-container'
    },
    'order from instagram': {
      icon: 'shopping_bag',
      label: 'order from ig',
      classes: 'bg-primary-fixed text-on-primary-fixed'
    }
  };

  function buildCard(name, siteUrl, tags) {
    const handle = handleFromUrl(siteUrl);

    const tagBadges = tags.map(tag => {
      const cfg = TAG_CONFIG[tag.toLowerCase()] || { icon: 'label', label: tag, classes: 'bg-surface-variant text-on-surface' };
      return `<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-[11px] font-label-bold ${cfg.classes}">
        <span class="material-symbols-outlined" style="font-size:13px;font-variation-settings:'FILL' 1;">${cfg.icon}</span>
        ${cfg.label}
      </span>`;
    }).join('');

    const card = document.createElement('a');
    card.href = siteUrl;
    card.target = '_blank';
    card.rel = 'noopener noreferrer';
    card.className = 'ig-card block no-underline';

    card.innerHTML = `
      <!-- Instagram gradient accent bar -->
      <div class="ig-gradient h-2"></div>

      <!-- Card body -->
      <div class="p-7 flex flex-col items-center text-center gap-4">

        <!-- Instagram logo icon -->
        <div class="w-14 h-14 rounded-[18px] ig-gradient flex items-center justify-center shadow-md">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="w-7 h-7">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
            <circle cx="12" cy="12" r="4"/>
            <circle cx="17.5" cy="6.5" r="0.8" fill="white" stroke="none"/>
          </svg>
        </div>

        <!-- Name + handle -->
        <div>
          <h2 class="font-headline-md text-[22px] text-primary leading-tight mb-1">${name}</h2>
          <p class="text-on-surface-variant text-sm font-label-bold tracking-wide">${handle}</p>
        </div>

        <!-- Tag badges -->
        ${tagBadges ? `<div class="flex flex-wrap justify-center gap-1.5">${tagBadges}</div>` : ''}

        <!-- CTA -->
        <div class="mt-1 inline-flex items-center gap-2 bg-primary text-on-primary px-5 py-2.5 rounded-full font-label-bold text-sm shadow-[2px_2px_0px_rgba(1,38,31,0.15)] transition-all">
          View on Instagram
          <svg viewBox="0 0 20 20" fill="currentColor" class="w-3.5 h-3.5 opacity-80">
            <path fill-rule="evenodd" d="M3 10a.75.75 0 01.75-.75h10.638L10.23 5.29a.75.75 0 111.04-1.08l5.5 5.25a.75.75 0 010 1.08l-5.5 5.25a.75.75 0 11-1.04-1.08l4.158-3.96H3.75A.75.75 0 013 10z" clip-rule="evenodd"/>
          </svg>
        </div>

      </div>
    `;

    return card;
  }

  async function loadAccounts() {
    try {
      const res = await fetch(
        `https://api.airtable.com/v0/${BASE_ID}/${encodeURIComponent(IG_TABLE)}?pageSize=100`,
        { headers: { Authorization: `Bearer ${AIRTABLE_TOKEN}` } }
      );
      if (!res.ok) throw new Error('Fetch failed');
      const { records } = await res.json();

      const grid = document.getElementById('ig-grid');
      records.forEach(r => {
        const name = r.fields['Name'] || '';
        const site = r.fields['site'] || '';
        const tags = (r.fields['Tags'] || []).map(t => t.name ?? t);
        if (name && site) grid.appendChild(buildCard(name, site, tags));
      });

      document.getElementById('loading').classList.add('hidden');
      grid.classList.remove('hidden');
    } catch (e) {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('error-state').classList.remove('hidden');
    }
  }

  loadAccounts();

  // ── Hamburger menu ──────────────────────────────────────────────────────────
  document.getElementById('hamburger-btn')?.addEventListener('click', function () {
    const menu = document.getElementById('mobile-menu');
    const bars = this.querySelectorAll('.hamburger-bar');
    const isOpen = menu.style.opacity === '1';
    if (!isOpen) {
      menu.style.transform = 'translateY(0)'; menu.style.opacity = '1'; menu.style.pointerEvents = 'auto';
      bars[0].style.transform = 'translateY(8px) rotate(45deg)';
      bars[1].style.opacity   = '0';
      bars[2].style.transform = 'translateY(-8px) rotate(-45deg)';
    } else {
      menu.style.transform = 'translateY(-8px)'; menu.style.opacity = '0'; menu.style.pointerEvents = 'none';
      bars[0].style.transform = ''; bars[1].style.opacity = ''; bars[2].style.transform = '';
    }
  });
</script>

</body>
</html>
