<script>
// ── CONFIGURATION ─────────────────────────────────────────────────────────────
const AIRTABLE_TOKEN      = 'patoO4IGP4ESJoWnD.a05da83d9b8e7a4f9808aa5cf85cf4e26b6971aa287b0bdaf76ffab3c76ec21e';
const BASE_ID             = 'apph243NPR5JjRPav';
const TABLE_ID            = 'tblRNrmF9zlhpC9fh';
const SUGGESTIONS_TABLE_ID = 'tblo2YLMwUUC9Hlbh';
// ─────────────────────────────────────────────────────────────────────────────

const MATCHA_STYLE = [
  { elementType: 'geometry',           stylers: [{ color: '#f2f7f3' }] },
  { elementType: 'labels.text.stroke', stylers: [{ color: '#f2f7f3' }] },
  { elementType: 'labels.text.fill',   stylers: [{ color: '#5a6e64' }] },
  { featureType: 'administrative.locality', elementType: 'labels.text.fill', stylers: [{ color: '#01261f' }] },
  { featureType: 'poi',                stylers: [{ visibility: 'off' }] },
  { featureType: 'poi.park',           elementType: 'geometry', stylers: [{ color: '#d8eedf' }] },
  { featureType: 'poi.park',           elementType: 'labels',   stylers: [{ visibility: 'on' }] },
  { featureType: 'poi.park',           elementType: 'labels.text.fill', stylers: [{ color: '#2c694e' }] },
  { featureType: 'road',               elementType: 'geometry', stylers: [{ color: '#ffffff' }] },
  { featureType: 'road',               elementType: 'geometry.stroke', stylers: [{ color: '#e4ece6' }] },
  { featureType: 'road',               elementType: 'labels.text.fill', stylers: [{ color: '#6b8577' }] },
  { featureType: 'road.highway',       elementType: 'geometry', stylers: [{ color: '#ddeee5' }] },
  { featureType: 'road.highway',       elementType: 'geometry.stroke', stylers: [{ color: '#b8d4c4' }] },
  { featureType: 'road.highway',       elementType: 'labels.text.fill', stylers: [{ color: '#2c694e' }] },
  { featureType: 'transit',            elementType: 'geometry', stylers: [{ color: '#d8eedf' }] },
  { featureType: 'water',              elementType: 'geometry', stylers: [{ color: '#bfe0cf' }] },
  { featureType: 'water',              elementType: 'labels.text.fill', stylers: [{ color: '#2c694e' }] },
];

let map, currentInfoWindow = null;
const markerMap = {};

// ── Called by Google Maps SDK ──────────────────────────────────────────────────
window.initApp = async function () {
  map = new google.maps.Map(document.getElementById('map-canvas'), {
    center: { lat: 39.7684, lng: -86.1581 },
    zoom: 13,
    styles: MATCHA_STYLE,
    disableDefaultUI: true,
    gestureHandling: 'greedy',
    clickableIcons: false,
  });

  document.getElementById('zoom-in').addEventListener('click',  () => map.setZoom(map.getZoom() + 1));
  document.getElementById('zoom-out').addEventListener('click', () => map.setZoom(map.getZoom() - 1));
  document.getElementById('my-location').addEventListener('click', () => {
    navigator.geolocation.getCurrentPosition(
      pos => { map.panTo({ lat: pos.coords.latitude, lng: pos.coords.longitude }); map.setZoom(15); },
      ()  => alert('Location access denied.')
    );
  });

  // Load filter chips from Airtable schema + spot cards in parallel
  const [filterOpts] = await Promise.all([fetchFilterOptions(), renderSpots()]);
  if (filterOpts) {
    renderFilterChips('area',   'area-chips',   filterOpts.area);
    renderFilterChips('matcha', 'matcha-chips', filterOpts.matcha);
    renderFilterChips('space',  'space-chips',  filterOpts.space);
  }
};

// ── Parse lat/lng from a Google Maps URL ──────────────────────────────────────
// Supports: google.com/maps/place/Name/@lat,lng,zoom
// Paste the URL directly from your browser's address bar on desktop Maps
function parseCoordsFromUrl(url) {
  if (!url) return null;
  const m = url.match(/@(-?\d+\.?\d+),(-?\d+\.?\d+)/);
  if (m) return { lat: parseFloat(m[1]), lng: parseFloat(m[2]) };
  // fallback: ?q=lat,lng
  const q = url.match(/[?&]q=(-?\d+\.?\d+),(-?\d+\.?\d+)/);
  if (q) return { lat: parseFloat(q[1]), lng: parseFloat(q[2]) };
  return null;
}

// ── Server-side Places cache (places-cache.json) ──────────────────────────────
// GitHub Actions refreshes this file nightly via the Places REST API.
// Loading it pre-populates localStorage so individual users never hit the API.
async function loadServerCache() {
  try {
    const res = await fetch('/places-cache.json');
    if (!res.ok) return;
    const { cached_at, spots } = await res.json();
    // Ignore if the file is older than 25 hours (missed a nightly run)
    if (Date.now() - new Date(cached_at).getTime() > 25 * 60 * 60 * 1000) return;
    Object.entries(spots || {}).forEach(([name, data]) => {
      // Only seed localStorage if there's no fresher local entry already there
      if (readPlaceCache(name) === undefined) {
        // Compute isOpenNow client-side so it reflects the user's current time
        const dayIndex = (new Date().getDay() + 6) % 7;
        const now      = new Date();
        const timeMins = now.getHours() * 60 + now.getMinutes();
        data.isOpenNow = isOpenAtTimeStr(
          (data.weekdayDescriptions || [])[dayIndex] || '', timeMins
        ) ?? null;
        writePlaceCache(name, data);
      }
    });
  } catch { /* silently fall back to individual API calls */ }
}

// ── Fetch live place details using Places API (New) ───────────────────────────
// Results are cached in localStorage for 23 hours so each spot costs at most
// one SearchTextRequest per day instead of one per page load.
const PLACES_CACHE_KEY = 'indyMatcha_places';
const PLACES_CACHE_TTL = 23 * 60 * 60 * 1000;

function readPlaceCache(name) {
  try {
    const store = JSON.parse(localStorage.getItem(PLACES_CACHE_KEY) || '{}');
    const hit   = store[name];
    if (hit && Date.now() - hit.ts < PLACES_CACHE_TTL) return hit.data;
  } catch {}
  return undefined; // undefined = miss; null = "not found" was cached
}

function writePlaceCache(name, data) {
  try {
    const store = JSON.parse(localStorage.getItem(PLACES_CACHE_KEY) || '{}');
    store[name] = { ts: Date.now(), data };
    localStorage.setItem(PLACES_CACHE_KEY, JSON.stringify(store));
  } catch {}
}

async function fetchPlaceDetails(name) {
  const cached = readPlaceCache(name);
  if (cached !== undefined) return cached;

  try {
    const { Place } = await google.maps.importLibrary('places');
    const { places } = await Place.searchByText({
      textQuery: `${name} Indianapolis Indiana`,
      fields: ['regularOpeningHours', 'rating', 'userRatingCount', 'nationalPhoneNumber', 'websiteURI', 'businessStatus'],
      maxResultCount: 1,
    });
    const p = places?.[0] ?? null;

    // Normalize to a plain JSON-serializable object so it survives localStorage
    const data = p ? {
      rating:               p.rating              ?? null,
      userRatingCount:      p.userRatingCount      ?? null,
      weekdayDescriptions:  p.regularOpeningHours?.weekdayDescriptions || [],
      isOpenNow:            p.regularOpeningHours?.isOpen?.()          ?? null,
      nationalPhoneNumber:  p.nationalPhoneNumber  ?? null,
      websiteURI:           p.websiteURI           ?? null,
    } : null;

    writePlaceCache(name, data);
    return data;
  } catch (err) {
    console.warn('[Places API]', err.message);
    return null;
  }
}

// ── Fetch filter choices from all records ─────────────────────────────────────
// Scans every record (published + drafts) for "The Matcha" / "The Space" values
// so any new choice assigned in Airtable automatically appears as a filter chip.
// Uses only data.records:read — no extra token scope required.
async function fetchFilterOptions() {
  try {
    const res = await fetch(
      `https://api.airtable.com/v0/${BASE_ID}/${TABLE_ID}?fields[]=The+Matcha&fields[]=The+Space&fields[]=area&pageSize=100`,
      { headers: { Authorization: `Bearer ${AIRTABLE_TOKEN}` } }
    );
    if (!res.ok) return null;
    const { records } = await res.json();
    const areaSet   = new Set();
    const matchaSet = new Set();
    const spaceSet  = new Set();
    records?.forEach(r => {
      const a = r.fields['area'];
      if (a) areaSet.add(a.name ?? a);
      (r.fields['The Matcha'] || []).forEach(v => matchaSet.add(v.name ?? v));
      (r.fields['The Space']  || []).forEach(v => spaceSet.add(v.name ?? v));
    });
    return { area: [...areaSet], matcha: [...matchaSet], space: [...spaceSet] };
  } catch (err) {
    console.warn('[FilterOptions]', err.message);
    return null;
  }
}

function renderFilterChips(category, containerId, values) {
  const container = document.getElementById(containerId);
  if (!container) return;
  container.innerHTML = '';
  values.forEach(value => {
    const btn = document.createElement('button');
    btn.className = 'filter-chip px-2.5 py-1 rounded-full font-label-bold text-[10px] border border-outline-variant bg-white text-primary transition-all hover:border-secondary';
    btn.dataset.category = category;
    btn.dataset.value    = value;
    btn.textContent      = value;
    btn.addEventListener('click', function () {
      const key = `${this.dataset.category}:${this.dataset.value}`;
      if (activeFilters.has(key)) { activeFilters.delete(key); this.classList.remove('active'); }
      else                        { activeFilters.add(key);    this.classList.add('active');    }
      applyFilters();
    });
    container.appendChild(btn);
  });
}

// ── Airtable fetch ────────────────────────────────────────────────────────────
async function fetchSpots() {
  const formula = encodeURIComponent("{publish}='publish'");

// 5-star SVG rating
function starsSvg(rating) {
  const full = Math.floor(rating), half = rating % 1 >= 0.5 ? 1 : 0, empty = 5 - full - half;
  const star = (type) => {
    const fill = type === 'full' ? '#f59e0b' : type === 'half' ? 'url(#half)' : '#e5e7eb';
    return `<svg width="13" height="13" viewBox="0 0 24 24" fill="${fill}" xmlns="http://www.w3.org/2000/svg">
      ${type === 'half' ? `<defs><linearGradient id="half"><stop offset="50%" stop-color="#f59e0b"/><stop offset="50%" stop-color="#e5e7eb"/></linearGradient></defs>` : ''}
      <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
    </svg>`;
  };
  return Array(full).fill(star('full')).concat(Array(half).fill(star('half'))).concat(Array(empty).fill(star('empty'))).join('');
}

// ── Submit a suggestion to Airtable ──────────────────────────────────────────
async function submitSuggestion({ recordId, spotName, type, category, filterValue, comment }) {
  const summary = type === 'New idea'
    ? `New idea for ${spotName}`
    : `${type}: "${filterValue}" (${category}) — ${spotName}`;

  const fields = {
    Suggestion:     summary,
    Location:       [recordId],
    Type:           type,
    Status:         'Pending',
    'Submitted At': new Date().toISOString(),
  };
  if (category)    fields.Category          = category;
  if (filterValue) fields['Filter Value']   = filterValue;
  if (comment)     fields.Comment           = comment;

  const res = await fetch(
    `https://api.airtable.com/v0/${BASE_ID}/${SUGGESTIONS_TABLE_ID}`,
    {
      method: 'POST',
      headers: { Authorization: `Bearer ${AIRTABLE_TOKEN}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ fields }),
    }
  );
  if (!res.ok) throw new Error(`Airtable ${res.status}`);
  return res.json();
}

// ── Open suggest panel from a map InfoWindow button ──────────────────────────
function openSuggestFromMap(recordId) {
  // On mobile switch to list view so the card is visible
  if (window.innerWidth < 768) setMobileView('list');
  const card = document.querySelector(`.spot-card[data-id="${recordId}"]`);
  if (!card) return;
  card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  const panel  = card.querySelector('.suggest-panel');
  const toggle = card.querySelector('.suggest-toggle');
  if (panel?.classList.contains('hidden')) toggle?.click();
}

// ── Wire up suggest-a-change form inside a card ───────────────────────────────
function initSuggestForm(cardEl, recordId, spotName, matchaTags, spaceTags) {
  const toggle     = cardEl.querySelector('.suggest-toggle');
  const panel      = cardEl.querySelector('.suggest-panel');
  const typeBtns   = cardEl.querySelectorAll('.suggest-type-btn');
  const catBtns    = cardEl.querySelectorAll('.suggest-cat-btn');
  const filterArea = cardEl.querySelector('.filter-select-area');
  const filterOpts = cardEl.querySelector('.filter-options');
  const textarea   = cardEl.querySelector('.suggest-comment');
  const submitBtn  = cardEl.querySelector('.suggest-submit');
  const cancelBtn  = cardEl.querySelector('.suggest-cancel');

  let selType = null, selCat = null, selFilters = new Set();

  // Prevent panel clicks from bubbling up to the card's map-open handler
  panel.addEventListener('click', e => e.stopPropagation());
  textarea.addEventListener('click', e => e.stopPropagation());

  const flash = (el, msg, restore, ms = 1800) => {
    el.textContent = msg;
    setTimeout(() => { el.textContent = restore; }, ms);
  };

  const reset = () => {
    selType = selCat = null; selFilters = new Set();
    typeBtns.forEach(b => b.classList.remove('active-suggest'));
    catBtns.forEach(b  => b.classList.remove('active-suggest'));
    filterArea.classList.add('hidden');
    filterOpts.innerHTML = '';
    textarea.value = '';
    textarea.placeholder = 'Any additional context… (optional)';
    submitBtn.disabled = false;
    submitBtn.textContent = 'submit →';
    submitBtn.style.background = '';
  };

  toggle.addEventListener('click', e => {
    e.stopPropagation();
    const wasOpen = !panel.classList.contains('hidden');
    panel.classList.toggle('hidden');
    if (wasOpen) reset();
  });

  cancelBtn.addEventListener('click', e => {
    e.stopPropagation();
    panel.classList.add('hidden');
    reset();
  });

  typeBtns.forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      selType = btn.dataset.type;
      selFilters = new Set();
      typeBtns.forEach(b => b.classList.remove('active-suggest'));
      btn.classList.add('active-suggest');

      if (selType === 'New idea') {
        filterArea.classList.add('hidden');
        textarea.placeholder = 'Describe your idea or suggestion…';
        textarea.focus();
      } else {
        filterArea.classList.remove('hidden');
        selCat = null;
        catBtns.forEach(b => b.classList.remove('active-suggest'));
        filterOpts.innerHTML = '';
        textarea.placeholder = 'Any additional context… (optional)';
      }
    });
  });

  catBtns.forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      selCat = btn.dataset.cat;
      selFilters = new Set();
      catBtns.forEach(b => b.classList.remove('active-suggest'));
      btn.classList.add('active-suggest');

      filterOpts.innerHTML = '';
      const catKey   = selCat === 'The Matcha' ? 'matcha' : 'space';
      const all      = [...document.querySelectorAll(`.filter-chip[data-category="${catKey}"]`)].map(b => b.dataset.value);
      const spotTags = selCat === 'The Matcha' ? matchaTags : spaceTags;
      const options  = selType === 'Add filter'
        ? all.filter(f => !spotTags.includes(f))
        : spotTags;

      if (!options.length) {
        filterOpts.innerHTML = `<span class="text-on-surface-variant text-[10px] italic">nothing to ${selType === 'Add filter' ? 'add' : 'remove'} here</span>`;
        return;
      }
      options.forEach(val => {
        const b = document.createElement('button');
        b.className   = 'suggest-filter-opt px-2 py-0.5 rounded-full font-label-bold text-[10px] border border-outline-variant bg-white text-primary hover:border-secondary transition-all';
        b.textContent = val;
        b.addEventListener('click', e2 => {
          e2.stopPropagation();
          if (selFilters.has(val)) {
            selFilters.delete(val);
            b.classList.remove('active-suggest');
          } else {
            selFilters.add(val);
            b.classList.add('active-suggest');
          }
        });
        filterOpts.appendChild(b);
      });
    });
  });

  submitBtn.addEventListener('click', async e => {
    e.stopPropagation();
    if (!selType) { flash(submitBtn, 'pick a type ↑', 'submit →'); return; }
    if (selType !== 'New idea' && selFilters.size === 0) { flash(submitBtn, 'pick a filter ↑', 'submit →'); return; }
    const comment = textarea.value.trim();
    if (selType === 'New idea' && !comment) { textarea.focus(); return; }

    submitBtn.disabled    = true;
    submitBtn.textContent = 'sending…';

    try {
      await submitSuggestion({ recordId, spotName, type: selType, category: selCat, filterValue: [...selFilters].join(', '), comment });
      submitBtn.textContent  = '✓ sent — thank you!';
      submitBtn.style.background = '#2c694e';
      setTimeout(() => { panel.classList.add('hidden'); reset(); }, 1800);
    } catch (err) {
      submitBtn.disabled = false;
      flash(submitBtn, 'error — try again', 'submit →');
    }
  });
}

// ── Main render ───────────────────────────────────────────────────────────────
async function renderSpots() {
  const list = document.getElementById('spots-list');
  try {
    const records = await fetchSpots();

    // Keep only spots that have a Maps URL (with parseable coords) or manual lat/lng
    const spots = records.filter(r => {
      const f = r.fields;
      return parseCoordsFromUrl(f['Maps URL']) || (f.Latitude && f.Longitude);
    });

    list.innerHTML = '';
    const countEl = document.getElementById('spot-count');
    countEl.textContent = `${spots.length} spot${spots.length !== 1 ? 's' : ''}`;
    countEl.classList.remove('opacity-0');

    if (spots.length === 0) {
      document.getElementById('empty-state').classList.remove('hidden');
      list.innerHTML = `<p class="text-center text-on-surface-variant text-sm py-10">No published spots yet.<br>
        <a href="submit.html" class="text-secondary underline font-label-bold mt-1 inline-block">Be the first to submit one →</a></p>`;
      return;
    }

    // Pre-populate localStorage from the nightly server cache.
    // After this, fetchPlaceDetails will find hits in localStorage for every
    // known spot and make zero Places API calls.
    await loadServerCache();

    // Fetch all place details in parallel (hits localStorage for cached spots)
    const placeDetails = await Promise.all(
      spots.map(r => fetchPlaceDetails(r.fields.Name || ''))
    );

    const bounds = new google.maps.LatLngBounds();

    spots.forEach((record, i) => {
      const f     = record.fields;
      const place = placeDetails[i];
      const grade = f.Grade?.name ?? f.Grade ?? '';
      const pos   = parseCoordsFromUrl(f['Maps URL']) || { lat: f.Latitude, lng: f.Longitude };

      // Marker
      const marker = new google.maps.Marker({
        position: pos, map,
        icon:  markerIcon(grade),
        title: f.Name || ''
      });
      markerMap[record.id] = marker;
      bounds.extend(pos);

      // InfoWindow
      const iw = new google.maps.InfoWindow({ content: buildInfoContent(f, place, record.id) });

      // Card
      const card = buildCard(record, place);
      list.appendChild(card);
      initSuggestForm(card, record.id, f.Name || '', (f['The Matcha']||[]).map(t=>t.name??t), (f['The Space']||[]).map(t=>t.name??t));

      const openSpot = () => {
        // On mobile switch to map view first, then pan
        if (window.innerWidth < 768) {
          setMobileView('map');
          setTimeout(() => {
            if (currentInfoWindow) currentInfoWindow.close();
            map.panTo(pos);
            if (map.getZoom() < 15) map.setZoom(15);
            iw.open({ anchor: marker, map });
            currentInfoWindow = iw;
            activateCard(record.id);
          }, 60);
          return;
        }
        if (currentInfoWindow) currentInfoWindow.close();
        map.panTo(pos);
        if (map.getZoom() < 15) map.setZoom(15);
        iw.open({ anchor: marker, map });
        currentInfoWindow = iw;
        activateCard(record.id);
      };

      card.addEventListener('click', openSpot);
      marker.addListener('click', () => {
        if (currentInfoWindow) currentInfoWindow.close();
        iw.open({ anchor: marker, map });
        currentInfoWindow = iw;
        activateCard(record.id);
        card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      });
      iw.addListener('closeclick', () => activateCard(null));
    });

    if (spots.length === 1) { map.setCenter(bounds.getCenter()); map.setZoom(15); }
    else map.fitBounds(bounds, { top: 60, right: 60, bottom: 60, left: 60 });

  } catch (err) {
    list.innerHTML = `<div class="p-6 text-center">
      <span class="material-symbols-outlined text-3xl text-error mb-2 block">error_outline</span>
      <p class="font-label-bold text-sm text-error mb-1">Couldn't load spots</p>
      <p class="text-on-surface-variant text-xs">${esc(err.message)}</p>
    </div>`;
    console.error('[IndyMatcha]', err);
  }
}

function activateCard(id) {
  document.querySelectorAll('.spot-card').forEach(c => c.classList.remove('active'));
  if (id) document.querySelector(`.spot-card[data-id="${id}"]`)?.classList.add('active');
}

document.getElementById('search-input').addEventListener('input', function () {
  const q = this.value.toLowerCase().trim();
  document.querySelectorAll('.spot-card').forEach(c => {
    const visible = !q || c.textContent.toLowerCase().includes(q);
    c.style.display = visible ? '' : 'none';
    const marker = markerMap[c.dataset.id];
    if (marker) marker.setVisible(visible);
  });
});

// ── Tag filters (AND between categories, OR within) ───────────────────────────
const activeFilters = new Set();

function applyFilters() {
  const areaActive   = [...activeFilters].filter(f => f.startsWith('area:')).map(f   => f.slice(5));
  const matchaActive = [...activeFilters].filter(f => f.startsWith('matcha:')).map(f => f.slice(7));
  const spaceActive  = [...activeFilters].filter(f => f.startsWith('space:')).map(f  => f.slice(6));

  document.querySelectorAll('.spot-card').forEach(card => {
    const cardArea   = JSON.parse(card.dataset.area   || '[]');
    const cardMatcha = JSON.parse(card.dataset.matcha || '[]');
    const cardSpace  = JSON.parse(card.dataset.space  || '[]');
    const areaOk  = areaActive.length   === 0 || areaActive.some(v   => cardArea.includes(v));
    const matchOk = matchaActive.length === 0 || matchaActive.some(v => cardMatcha.includes(v));
    const spaceOk = spaceActive.length  === 0 || spaceActive.some(v  => cardSpace.includes(v));
    let timeOk = true;
    if (timeFilterDay !== null) {
      const wds      = JSON.parse(card.dataset.weekdays || '[]');
      const openResult = isOpenAtTimeStr(wds[timeFilterDay] || '', timeFilterMins);
      if (openResult === false) timeOk = false; // null = unknown hours → let through
    }
    const visible = areaOk && matchOk && spaceOk && timeOk;
    card.style.display = visible ? '' : 'none';
    const marker = markerMap[card.dataset.id];
    if (marker) marker.setVisible(visible);
  });

  document.getElementById('clear-filters').classList.toggle('hidden', activeFilters.size === 0);
}


document.getElementById('clear-filters').addEventListener('click', () => {
  activeFilters.clear();
  document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
  // Also reset time filter
  timeFilterDay = null;
  document.querySelectorAll('.time-day-chip').forEach(c => c.classList.remove('active-suggest'));
  document.getElementById('time-slider').classList.add('opacity-40');
  document.getElementById('clear-time-filter').classList.add('hidden');
  document.querySelectorAll('.spot-card').forEach(c => {
    c.style.display = '';
    const marker = markerMap[c.dataset.id];
    if (marker) marker.setVisible(true);
  });
  document.getElementById('clear-filters').classList.add('hidden');
});

// ── Time filter ───────────────────────────────────────────────────────────────
let timeFilterDay  = null;   // null = inactive; 0-6 = Mon–Sun
let timeFilterMins = 540;    // minutes from midnight; updated by slider

function formatTime(mins) {
  const h = Math.floor(mins / 60) % 24;
  const m = mins % 60;
  const ampm = h < 12 ? 'AM' : 'PM';
  const h12  = h === 0 ? 12 : h > 12 ? h - 12 : h;
  return `${h12}:${m.toString().padStart(2, '0')} ${ampm}`;
}

// Parse a weekdayDescriptions string like "Monday: 7:00 AM – 8:30 PM"
// Returns true/false/null (null = unknown, treat as open)
function isOpenAtTimeStr(dayStr, timeMins) {
  if (!dayStr) return null;
  const lower = dayStr.toLowerCase();
  if (lower.includes('closed'))    return false;
  if (lower.includes('open 24'))   return true;
  // Match "H:MM AM/PM – H:MM AM/PM" with em-dash or regular dash
  const m = dayStr.match(/(\d{1,2}):(\d{2})\s*(AM|PM)\s*[–\-]\s*(\d{1,2}):(\d{2})\s*(AM|PM)/i);
  if (!m) return null;
  let [, oh, om, oa, ch, cm, ca] = m;
  oh = parseInt(oh); om = parseInt(om); ch = parseInt(ch); cm = parseInt(cm);
  if (oa.toUpperCase() === 'PM' && oh !== 12) oh += 12;
  if (oa.toUpperCase() === 'AM' && oh === 12) oh = 0;
  if (ca.toUpperCase() === 'PM' && ch !== 12) ch += 12;
  if (ca.toUpperCase() === 'AM' && ch === 12) ch = 0;
  const openMins = oh * 60 + om;
  let closeMins  = ch * 60 + cm;
  if (closeMins <= openMins) closeMins += 1440; // overnight wrap
  return timeMins >= openMins && timeMins < closeMins;
}

(function initTimeFilter() {
  const slider   = document.getElementById('time-slider');
  const display  = document.getElementById('time-display');
  const clearBtn = document.getElementById('clear-time-filter');
  const dayChips = document.querySelectorAll('.time-day-chip');

  // Seed slider to current time clamped to range
  const nowMins = new Date().getHours() * 60 + new Date().getMinutes();
  timeFilterMins = Math.min(Math.max(nowMins, 360), 1320);
  slider.value        = timeFilterMins;
  display.textContent = formatTime(timeFilterMins);

  slider.addEventListener('input', () => {
    timeFilterMins      = parseInt(slider.value);
    display.textContent = formatTime(timeFilterMins);
    if (timeFilterDay !== null) applyFilters();
  });

  dayChips.forEach(chip => {
    chip.addEventListener('click', () => {
      const day    = parseInt(chip.dataset.day);
      const active = !chip.classList.contains('active-suggest'); // toggle
      dayChips.forEach(c => c.classList.remove('active-suggest'));
      if (active) {
        chip.classList.add('active-suggest');
        timeFilterDay = day;
        slider.classList.remove('opacity-40');
        clearBtn.classList.remove('hidden');
        document.getElementById('clear-filters').classList.remove('hidden');
      } else {
        timeFilterDay = null;
        slider.classList.add('opacity-40');
        clearBtn.classList.add('hidden');
        if (activeFilters.size === 0) document.getElementById('clear-filters').classList.add('hidden');
      }
      applyFilters();
    });
  });

  clearBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    timeFilterDay = null;
    dayChips.forEach(c => c.classList.remove('active-suggest'));
    slider.classList.add('opacity-40');
    clearBtn.classList.add('hidden');
    applyFilters();
    if (activeFilters.size === 0) document.getElementById('clear-filters').classList.add('hidden');
  });
})();

// ── Collapsible filter sections ───────────────────────────────────────────────
document.querySelectorAll('.filter-toggle').forEach(btn => {
  btn.addEventListener('click', function () {
    const chips = document.getElementById(this.dataset.target);
    const caret = this.querySelector('.toggle-caret');
    const isNowHidden = chips.classList.toggle('hidden');
    caret.style.transform = isNowHidden ? 'rotate(-90deg)' : 'rotate(0deg)';
  });
});

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

// ── Mobile: map / list view toggle ───────────────────────────────────────────
function setMobileView(view) {
  const main     = document.querySelector('main');
  const listBtn  = document.getElementById('mobile-list-btn');
  const mapBtn   = document.getElementById('mobile-map-btn');
  if (view === 'map') {
    main.classList.add('mobile-map');
    listBtn?.classList.remove('active');
    mapBtn?.classList.add('active');
    // Tell Google Maps to recalculate its size now that it's visible
    if (typeof google !== 'undefined' && typeof map !== 'undefined' && map) {
      google.maps.event.trigger(map, 'resize');
    }
  } else {
    main.classList.remove('mobile-map');
    listBtn?.classList.add('active');
    mapBtn?.classList.remove('active');
  }
}

// ── Mobile: hamburger menu ────────────────────────────────────────────────────
document.getElementById('hamburger-btn')?.addEventListener('click', function () {
  const menu  = document.getElementById('mobile-menu');
  const bars  = this.querySelectorAll('.hamburger-bar');
  const isOpen = menu.classList.toggle('open');
  // Animate bars into X when open
  if (isOpen) {
    bars[0].style.transform = 'translateY(8px) rotate(45deg)';
    bars[1].style.opacity   = '0';
    bars[2].style.transform = 'translateY(-8px) rotate(-45deg)';
  } else {
    bars[0].style.transform = '';
    bars[1].style.opacity   = '';
    bars[2].style.transform = '';
  }
});

// Close menu when a link inside it is tapped
document.getElementById('mobile-menu')?.querySelectorAll('a').forEach(a => {
  a.addEventListener('click', () => {
    document.getElementById('mobile-menu').classList.remove('open');
  });
});
